name: CI
on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate    # Prisma client (offline, no DB)
      - run: npm run typecheck       # all packages + web + api
      - run: npm test                # 133 tests incl. server-side guard tests
      - run: npm run build           # web production bundle
